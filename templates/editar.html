<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Editar Mascota - Veterinaria Huellitas</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


    <!-- ENCABEZADO -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <span class="navbar-brand">

                🐾 Veterinaria Huellitas

            </span>

        </div>

    </nav>


    <!-- FORMULARIO -->

    <div class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow-sm">


                    <div class="card-header bg-warning">

                        <h4 class="mb-0">

                            ✏️ Editar paciente

                        </h4>

                    </div>


                    <div class="card-body">

                        <form
                            action="/editar/{{ paciente.id }}"
                            method="POST">


                            <div class="mb-3">

                                <label class="form-label">

                                    Nombre de la mascota

                                </label>

                                <input
                                    type="text"
                                    name="nombre"
                                    value="{{ paciente.nombre }}"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">

                                    Especie

                                </label>

                                <select
                                    name="especie"
                                    class="form-select"
                                    required>

                                    <option
                                        value="Perro"
                                        {% if paciente.especie == 'Perro' %}
                                        selected
                                        {% endif %}>

                                        🐶 Perro

                                    </option>


                                    <option
                                        value="Gato"
                                        {% if paciente.especie == 'Gato' %}
                                        selected
                                        {% endif %}>

                                        🐱 Gato

                                    </option>


                                    <option
                                        value="Ave"
                                        {% if paciente.especie == 'Ave' %}
                                        selected
                                        {% endif %}>

                                        🐦 Ave

                                    </option>


                                    <option
                                        value="Conejo"
                                        {% if paciente.especie == 'Conejo' %}
                                        selected
                                        {% endif %}>

                                        🐰 Conejo

                                    </option>


                                    <option
                                        value="Otro"
                                        {% if paciente.especie == 'Otro' %}
                                        selected
                                        {% endif %}>

                                        🐾 Otro

                                    </option>

                                </select>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">

                                    Nombre del dueño

                                </label>

                                <input
                                    type="text"
                                    name="dueno"
                                    value="{{ paciente.dueno }}"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">

                                    Teléfono

                                </label>

                                <input
                                    type="tel"
                                    name="telefono"
                                    value="{{ paciente.telefono }}"
                                    class="form-control"
                                    required>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-primary w-100">

                                💾 Guardar cambios

                            </button>


                            <a
                                href="/"
                                class="btn btn-secondary w-100 mt-2">

                                ↩️ Cancelar

                            </a>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


</body>

</html>
